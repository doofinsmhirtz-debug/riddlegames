
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Silly Riddle Challenge</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    text-align: center;
    background: linear-gradient(135deg, #ffeaa7, #fab1a0, #a29bfe);
    color: #333;
}

.container {
    max-width: 650px;
    margin: auto;
    padding: 25px 15px;
}

h1 {
    color: #6c5ce7;
    font-size: 36px;
    text-shadow: 2px 2px white;
}

.subtitle {
    font-size: 17px;
}

.card {
    background: white;
    border-radius: 25px;
    padding: 25px 20px;
    margin-top: 25px;
    box-shadow: 0 8px 20px #0002;
}

#progress {
    font-weight: bold;
    color: #6c5ce7;
    font-size: 18px;
}

#timer {
    font-size: 24px;
    color: #e17055;
    margin: 15px;
}

#question {
    font-size: 23px;
    min-height: 65px;
}

.answers {
    display: grid;
    gap: 12px;
    margin-top: 20px;
}

button {
    border: none;
    border-radius: 15px;
    padding: 16px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    background: #74b9ff;
    color: white;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.04);
    background: #0984e3;
}

#message {
    font-size: 20px;
    font-weight: bold;
    margin-top: 20px;
    min-height: 30px;
    color: #00b894;
}

#nextButton {
    display: none;
    background: #00b894;
    width: 100%;
    margin-top: 15px;
}

#jumpscare {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
    z-index: 100;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    overflow: hidden;
}

#scaryImage {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    animation: scaryShake 0.08s infinite;
}

#scaryText {
    position: relative;
    z-index: 2;
    font-size: clamp(35px, 9vw, 90px);
    color: red;
    font-weight: bold;
    text-shadow: 0 0 25px red;
}

@keyframes scaryShake {
    0% { transform: translate(0,0) rotate(0deg) scale(1.1); }
    25% { transform: translate(-15px,10px) rotate(-2deg) scale(1.15); }
    50% { transform: translate(15px,-10px) rotate(2deg) scale(1.1); }
    75% { transform: translate(-10px,-15px) rotate(-2deg) scale(1.15); }
    100% { transform: translate(0,0) rotate(0deg) scale(1.1); }
}

#replay {
    display: none;
    position: relative;
    z-index: 3;
    background: darkred;
    margin-top: 30px;
}
</style>
</head>

<body>

<div class="container" id="game">

    <h1>🌈 SILLY RIDDLE CHALLENGE 😂</h1>

    <p class="subtitle">
        Welcome, genius! Let's see how smart you are!
    </p>

    <div class="card">

        <div id="progress">Question 1 of 6</div>

        <div id="timer">⏰ 60 seconds</div>

        <h2 id="question"></h2>

        <div class="answers" id="answers"></div>

        <div id="message"></div>

        <button id="nextButton" onclick="nextQuestion()">
            NEXT QUESTION ➡️
        </button>

    </div>
</div>

<!-- JUMPSCARE -->
<div id="jumpscare">

    <img id="scaryImage" src="picture.gif" alt="">

    <div id="scaryText">SURPRISE!!! 💀</div>

    <button id="replay" onclick="location.reload()">
        PLAY AGAIN 😂
    </button>

</div>

<audio id="scaryVoice" src="sound.mp3" preload="auto"></audio>

<script>

const riddles = [

{
    question: "What has keys but cannot open locks?",
    answers: ["A Door", "A Piano", "A Treasure Chest", "A Window"],
    correct: 1
},

{
    question: "What has a face and two hands but no arms or legs?",
    answers: ["A Clock", "A Robot", "A Doll", "A Monkey"],
    correct: 0
},

{
    question: "What gets wetter the more it dries?",
    answers: ["A Sponge", "A Towel", "A Shirt", "A Cloud"],
    correct: 1
},

{
    question: "What has many teeth but cannot bite?",
    answers: ["A Shark", "A Lion", "A Comb", "A Dinosaur"],
    correct: 2
},

{
    question: "What has a neck but no head?",
    answers: ["A Human", "A Bottle", "A Giraffe", "A Chicken"],
    correct: 1
},

{
    question: "What can travel around the world while staying in one corner?",
    answers: ["A Plane", "A Stamp", "A Bird", "A Car"],
    correct: 1
}

];

const funnyMessages = [
    "🎉 WOW! Your brain is working!",
    "😂 TOO EASY FOR YOU!",
    "🧠 GENIUS ALERT!",
    "👏 AMAZING! Keep going!",
    "😎 You're on fire!",
    "🏆 YOU'RE A RIDDLE MASTER!"
];

let currentQuestion = 0;
let timeLeft = 60;
let gameOver = false;
let timer;

const questionEl = document.getElementById("question");
const answersEl = document.getElementById("answers");
const messageEl = document.getElementById("message");
const nextButton = document.getElementById("nextButton");

function startTimer() {

    clearInterval(timer);

    timeLeft = 60;
    document.getElementById("timer").textContent =
        "⏰ " + timeLeft + " seconds";

    timer = setInterval(() => {

        if (gameOver) return;

        timeLeft--;

        document.getElementById("timer").textContent =
            "⏰ " + timeLeft + " seconds";

        if (timeLeft <= 0) {
            clearInterval(timer);
            gameOver = true;
            messageEl.textContent = "😂 TOO SLOW! TIME IS UP!";
            answersEl.innerHTML = "";
            nextButton.style.display = "none";
        }

    }, 1000);

}

function loadQuestion() {

    const riddle = riddles[currentQuestion];

    document.getElementById("progress").textContent =
        "Question " + (currentQuestion + 1) +
        " of " + riddles.length;

    questionEl.textContent = riddle.question;

    answersEl.innerHTML = "";

    messageEl.textContent = "";

    nextButton.style.display = "none";

    riddle.answers.forEach((answer, index) => {

        const button = document.createElement("button");

        button.textContent =
            String.fromCharCode(65 + index) + ". " + answer;

        button.onclick = () => checkAnswer(index);

        answersEl.appendChild(button);

    });

    startTimer();

}

function checkAnswer(selected) {

    if (gameOver) return;

    const correct = riddles[currentQuestion].correct;

    if (selected === correct) {

        clearInterval(timer);

        messageEl.textContent =
            funnyMessages[currentQuestion];

        answersEl.innerHTML = "";

        if (currentQuestion === riddles.length - 1) {

            nextButton.textContent = "CLAIM YOUR PRIZE 🎁";

        } else {

            nextButton.textContent = "NEXT QUESTION ➡️";

        }

        nextButton.style.display = "block";

    } else {

        messageEl.style.color = "#d63031";
        messageEl.textContent =
            "❌ WRONG! HAHAHA! TRY AGAIN!";

    }

}

function nextQuestion() {

    currentQuestion++;

    if (currentQuestion >= riddles.length) {

        triggerJumpscare();

        return;

    }

    messageEl.style.color = "#00b894";

    loadQuestion();

}

function triggerJumpscare() {

    gameOver = true;

    clearInterval(timer);

    document.getElementById("game").style.display = "none";

    const scare = document.getElementById("jumpscare");

    scare.style.display = "flex";

    const voice = document.getElementById("scaryVoice");

    voice.volume = 1;

    voice.play().catch(() => {
        console.log("Audio playback blocked.");
    });

    setTimeout(() => {

        document.getElementById("replay").style.display = "block";

    }, 3000);

}

loadQuestion();

</script>

</body>
</html>
